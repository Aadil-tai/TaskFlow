# This file runs TWO containers with one command:
#   1. db  - the PostgreSQL database
#   2. api - your TaskFlow backend (built from the Dockerfile right here)

services:

  # ---------- Service 1: the database ----------
  db:
    image: postgres:16                      # official ready-made Postgres image
    container_name: taskflow-db
    environment:
      POSTGRES_USER: postgres               # database username
      POSTGRES_PASSWORD: postgres           # database password
      POSTGRES_DB: taskflow                 # database name
    volumes:
      - taskflow-data:/var/lib/postgresql/data   # save data on disk, NOT inside the container
    ports:
      - "5432:5432"                         # expose DB on your PC (so you can inspect it)
    healthcheck:                            # tells Compose "when is the DB actually ready?"
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------- Service 2: your backend ----------
  api:
    build: .                                # build the image using the Dockerfile in this folder
    container_name: taskflow-api
    ports:
      - "5000:5000"                         # your PC:5000 -> container:5000
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/taskflow
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      FRONTEND_URL: https://task-flow-frontend-snowy-six.vercel.app
      PORT: 5000
    depends_on:
      db:
        condition: service_healthy          # only start the API once the DB is really up
    restart: unless-stopped                 # auto-restart if it crashes or the PC reboots

# Named volume = persistent disk storage for the database
volumes:
  taskflow-data: